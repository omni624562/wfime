name: Build APK

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x LimeStudio/gradlew

      - name: Run unit tests
        run: cd LimeStudio && ./gradlew testPhoneDebugUnitTest --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wfime-test-reports-${{ github.sha }}
          path: LimeStudio/app/build/reports/tests/
          retention-days: 14

      - name: Build debug APK
        run: cd LimeStudio && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wfime-debug-${{ github.sha }}
          path: LimeStudio/app/build/outputs/apk/*/debug/*.apk
          retention-days: 30

      # CI 沒有正式金鑰，release 用臨時產生的金鑰簽署，只用來確認 R8 縮減後能建置，不可拿來發布
      - name: Create throwaway signing key
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        run: cd LimeStudio && ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wfime-release-ci-${{ github.sha }}
          path: LimeStudio/app/build/outputs/apk/*/release/*.apk
          retention-days: 30
